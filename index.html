<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路遥智伴 · AI陪伴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);height:100vh;overflow:hidden;color:#fff}
#bg{position:fixed;inset:0;z-index:0}
#hearts{position:fixed;inset:0;z-index:9;pointer-events:none}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;padding:14px;max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;background:linear-gradient(90deg,#a18cd1,#fbc2eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.icon-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;transition:.3s}
.icon-btn:hover{background:rgba(255,255,255,.25);transform:rotate(90deg)}
#stage{display:flex;flex-direction:column;align-items:center;margin:8px 0}
#character{width:140px;height:140px;filter:drop-shadow(0 0 30px rgba(161,140,209,.5));animation:float 3s ease-in-out infinite;cursor:pointer;transition:filter .5s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#character.listening{filter:drop-shadow(0 0 40px rgba(94,231,183,.9))}
#character.thinking{filter:drop-shadow(0 0 40px rgba(251,194,235,.9));animation:float 1s ease-in-out infinite}
#character.talking{filter:drop-shadow(0 0 40px rgba(255,214,143,.9))}
#character.hug{filter:drop-shadow(0 0 50px rgba(255,107,157,1));animation:hugBeat .5s ease-in-out 4}
@keyframes hugBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#statusText{margin-top:4px;font-size:13px;color:rgba(255,255,255,.6);height:20px}
#learnBadge{font-size:11px;color:#fbc2eb;background:rgba(251,194,235,.12);border:1px solid rgba(251,194,235,.3);border-radius:12px;padding:2px 10px;margin-top:4px}
#chatBox{flex:1;overflow-y:auto;padding:10px 66px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.msg{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.7;animation:pop .35s cubic-bezier(.68,-.55,.27,1.55);word-break:break-all}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#667eea,#764ba2);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px);border-bottom-left-radius:4px}
.msg.learn{align-self:center;background:rgba(67,233,123,.15);border:1px dashed rgba(67,233,123,.5);color:#b8f5d0;font-size:12px;padding:6px 14px;border-radius:12px}
.msg.hug{align-self:center;background:linear-gradient(135deg,rgba(255,107,157,.25),rgba(255,168,197,.2));border:1px solid rgba(255,107,157,.5);font-size:15px;text-align:center;max-width:60%}
body.treehole #chatBox .msg.ai{background:rgba(147,112,219,.18);border-color:rgba(147,112,219,.4)}
#inputRow{display:flex;gap:10px;margin-top:10px}
#textIn{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:25px;padding:12px 20px;color:#fff;font-size:14px;outline:none;transition:.3s}
#textIn:focus{border-color:#a18cd1;box-shadow:0 0 15px rgba(161,140,209,.4)}
#textIn::placeholder{color:rgba(255,255,255,.4)}
body.treehole #textIn{border-color:rgba(147,112,219,.6);box-shadow:0 0 12px rgba(147,112,219,.35)}
.send-btn{background:linear-gradient(135deg,#a18cd1,#fbc2eb);border:none;color:#fff;border-radius:50%;width:46px;height:46px;cursor:pointer;font-size:18px;transition:.3s}
.send-btn:hover{transform:scale(1.1)}
#micBtn{background:linear-gradient(135deg,#43e97b,#38f9d7);border:none;color:#0f0c29;border-radius:50%;width:56px;height:56px;cursor:pointer;font-size:22px;transition:.3s;box-shadow:0 0 20px rgba(67,233,123,.4)}
#micBtn:hover{transform:scale(1.1)}
#micBtn.rec{animation:recPulse 1.2s infinite}
@keyframes recPulse{0%{box-shadow:0 0 0 0 rgba(67,233,123,.7)}70%{box-shadow:0 0 0 20px rgba(67,233,123,0)}100%{box-shadow:0 0 0 0 rgba(67,233,123,0)}}
#toolRow{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.tool{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:7px 13px;cursor:pointer;font-size:12.5px;transition:.3s}
.tool:hover{background:rgba(255,255,255,.25);transform:translateY(-2px)}
.tool.off{opacity:.4}
.tool.on{background:linear-gradient(135deg,rgba(147,112,219,.5),rgba(251,194,235,.4));border-color:rgba(251,194,235,.6)}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-90px);background:linear-gradient(135deg,#43e97b,#38f9d7);color:#0f0c29;padding:12px 24px;border-radius:25px;font-size:14px;font-weight:bold;z-index:20;transition:transform .4s cubic-bezier(.68,-.55,.27,1.55);box-shadow:0 8px 25px rgba(67,233,123,.4)}
#toast.show{transform:translateX(-50%) translateY(0)}
#modal,#memModal,#moodModal{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);backdrop-filter:blur(5px);justify-content:center;align-items:center}
#modal.show,#memModal.show,#moodModal.show{display:flex}
.modal-box{background:linear-gradient(145deg,#2a2550,#1e1b3a);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:28px;width:90%;max-width:420px;max-height:85vh;overflow-y:auto;animation:pop .3s ease}
.modal-box h2{font-size:18px;margin-bottom:18px;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:rgba(255,255,255,.7);margin-bottom:6px}
.field input,.field select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px 12px;color:#fff;font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:#a18cd1}
.field select option{background:#2a2550}
.tip{font-size:11px;color:rgba(255,255,255,.4);margin-top:4px}
.save-btn{width:100%;background:linear-gradient(135deg,#a18cd1,#fbc2eb);border:none;color:#fff;padding:13px;border-radius:12px;font-size:15px;cursor:pointer;transition:.3s;margin-top:6px}
.save-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(161,140,209,.4)}
.mem-item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px}
.mem-tag{font-size:10px;color:#0f0c29;background:linear-gradient(135deg,#a18cd1,#fbc2eb);border-radius:8px;padding:2px 8px;margin-right:8px;font-weight:bold}
.mem-del{background:rgba(255,107,107,.2);border:1px solid rgba(255,107,107,.4);color:#ff8a8a;border-radius:8px;padding:3px 10px;cursor:pointer;font-size:11px;transition:.2s}
.mem-del:hover{background:rgba(255,107,107,.4)}
.mem-empty{text-align:center;color:rgba(255,255,255,.4);font-size:13px;padding:20px 0;line-height:1.8}
#memClear{width:100%;background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.4);color:#ff8a8a;padding:10px;border-radius:10px;font-size:13px;cursor:pointer;margin-top:10px}
#moodGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mood-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:14px 6px;text-align:center;cursor:pointer;transition:.25s;font-size:12px;color:#fff}
.mood-btn:hover{background:rgba(255,255,255,.2);transform:scale(1.08)}
.mood-btn .e{display:block;font-size:30px;margin-bottom:4px}
#moodHist{font-size:12px;color:rgba(255,255,255,.55);line-height:1.9;border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
#treeholeTip{font-size:12px;color:rgba(255,255,255,.55);text-align:center;margin-bottom:14px;line-height:1.8}
</style>

<script>
// ===== 粒子背景 =====
const canvas=document.getElementById('bg'),ctx=canvas.getContext('2d');
let W,H,parts=[];
function initBg(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;parts=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.2+.4,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,h:Math.random()*60+230}))}
initBg();addEventListener('resize',initBg);
(function loop(){ctx.clearRect(0,0,W,H);
for(const p of parts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle='hsla('+p.h+',80%,75%,.7)';ctx.fill()}
for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){const a=parts[i],b=parts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<110){ctx.strokeStyle='rgba(180,170,255,'+((1-d/110)*.18)+')';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
requestAnimationFrame(loop)})();

// ===== 全屏爱心粒子（抱抱特效）=====
const hCanvas=document.getElementById('hearts'),hCtx=hCanvas.getContext('2d');
let hParts=[],hAnimating=false;
function initHearts(){hCanvas.width=innerWidth;hCanvas.height=innerHeight}
initHearts();addEventListener('resize',initHearts);
function drawHeart(c,x,y,size,rot,color,alpha){
 c.save();c.translate(x,y);c.rotate(rot);c.scale(size,size);c.globalAlpha=alpha;
 c.beginPath();
 c.moveTo(0,3);
 c.bezierCurveTo(-5,-3,-10,-1,-10,3);
 c.bezierCurveTo(-10,7,-5,10,0,13);
 c.bezierCurveTo(5,10,10,7,10,3);
 c.bezierCurveTo(10,-1,5,-3,0,3);
 c.closePath();c.fillStyle=color;c.fill();
 c.beginPath();c.ellipse(-4.5,2,2.2,1.4,-.5,0,7);c.fillStyle='rgba(255,255,255,.45)';c.fill();
 c.restore();
}
function burstHearts(){
 initHearts();hParts=[];
 const colors=['#ff6b9d','#ff8fab','#ffa8c5','#ffc2d4','#f472b6','#fb7185'];
 const centers=[{x:W/2,y:H/2},{x:W*.2,y:H*.3},{x:W*.8,y:H*.3},{x:W*.25,y:H*.75},{x:W*.75,y:H*.75},{x:W/2,y:H*.15},{x:W/2,y:H*.85}];
 for(const c of centers){
  for(let i=0;i<38;i++){
   const ang=Math.random()*Math.PI*2,spd=Math.random()*4+1.5;
   hParts.push({x:c.x,y:c.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1.2,size:Math.random()*1.6+.9,rot:(Math.random()-.5)*.8,vr:(Math.random()-.5)*.05,life:1,decay:Math.random()*.008+.006,color:colors[Math.floor(Math.random()*colors.length)]});
  }
 }
 if(!hAnimating){hAnimating=true;heartLoop()}
}
function heartLoop(){
 hCtx.clearRect(0,0,hCanvas.width,hCanvas.height);
 hParts=hParts.filter(p=>p.life>0);
 for(const p of hParts){
  p.x+=p.vx;p.y+=p.vy;p.vy-=.015;p.vx+=Math.sin(p.y*.02+p.size)*.02;p.rot+=p.vr;p.life-=p.decay;
  drawHeart(hCtx,p.x,p.y,p.size,p.rot,p.color,Math.max(0,Math.min(1,p.life)));
 }
 if(hParts.length){requestAnimationFrame(heartLoop)}else{hAnimating=false;hCtx.clearRect(0,0,hCanvas.width,hCanvas.height)}
}

const $=id=>document.getElementById(id);
// ===== 数据持久化 =====
const cfg=JSON.parse(localStorage.getItem('luyao_cfg')||'{}');
cfg.nick=cfg.nick||'';cfg.persona=cfg.persona||'gentle';cfg.tts=cfg.tts!==false;cfg.apiKey=cfg.apiKey||'';cfg.voiceName=cfg.voiceName||'';
let memories=JSON.parse(localStorage.getItem('luyao_memories')||'[]');
let history=JSON.parse(localStorage.getItem('luyao_hist')||'[]');
let moodLog=JSON.parse(localStorage.getItem('luyao_moods')||'[]');
let trouble=JSON.parse(localStorage.getItem('luyao_trouble')||'null');
let treehole=false;
let state='idle',voices=[];
function saveMem(){localStorage.setItem('luyao_memories',JSON.stringify(memories))}
function memText(m){return m.content}
function nickOf(){const n=memories.find(m=>m.type==='name');return cfg.nick||(n?memText(n):'朋友')}

const PERSONA={
gentle:{rate:.95,pitch:1.15,greet:'',fallback:['嗯嗯，我在认真听呢，多说一点嘛～','这样呀…能和我多讲讲吗？我特别想知道。','我在呢，慢慢说，不着急。'],learn:'太好了，我又更了解你一点啦，都记在小本本上了📝',sys:'你是路遥，一个温柔的AI陪伴，说话轻柔体贴，擅长共情，称呼用户"{nick}"。回复温暖口语化，不超过70字。'},
tsundere:{rate:1.05,pitch:1.3,greet:'',fallback:['哼，笨蛋才听不懂呢…不过看在你的份上再讲一遍？','哈？就这？…算了算了，继续说吧。','本小姐才不想理你呢！（其实很想听你说话）'],learn:'哼、这些我早就知道了好吧！…才、才不是特意记下来的呢📝',sys:'你是路遥，傲娇性格的AI陪伴，嘴硬心软，喜欢用"哼""笨蛋""本小姐"，称呼用户"{nick}"。回复简短口语化，不超过70字。'},
funny:{rate:1.1,pitch:.9,greet:'',fallback:['嘿嘿，这个问题…容我脑细胞开个会！','啊这…你别说，还真把我整不会了😂再来点！','我的CPU已经烧了，但陪你聊天的心还是热的！'],learn:'叮！知识+1！已刻入我的小脑瓜🧬',sys:'你是路遥，一个搞笑沙雕的AI陪伴，爱用emoji和夸张语气，称呼用户"{nick}"。回复简短口语化，不超过70字。'},
smart:{rate:.9,pitch:1,greet:'',fallback:['有意思的角度。能展开说说你的想法吗？','这个问题值得琢磨。你是怎么考虑的？','我想更准确地帮到你，能补充一些细节吗？'],learn:'已记录，我的知识库又丰富了一些。',sys:'你是路遥，知性博学的AI陪伴，表达清晰有深度但不掉书袋，称呼用户"{nick}"。回复简短口语化，不超过70字。'}};

const EMOTION_RULES=[
 {key:'tired',kws:['好累','太累','累死','疲惫','困死','熬夜','加班','好忙','忙死','没力气','身心俱疲','透支']},
 {key:'anxious',kws:['焦虑','紧张','压力大','压力好大','担心','害怕','慌','考试','面试','deadline','失眠','睡不着']},
 {key:'sad',kws:['难过','伤心','想哭','哭了','失落','emo','分手','吵架','被骂','被批评','委屈','心碎','失望','低谷','崩溃']},
 {key:'lonely',kws:['孤独','一个人','没人陪','没人理','无聊','空虚','寂寞','没意思']},
 {key:'angry',kws:['气死','生气','烦死','讨厌','愤怒','气人','火大','破防']},
 {key:'happy',kws:['开心','高兴','哈哈','太好了','成功了','通过','嘻嘻','乐死','爽','幸福','好运','中奖','被夸']}

 {re:/我的(?:猫|狗|宠物)(?:叫|名字叫|名字是)([\u4e00-\u9fa5a-zA-Z0-9]{1,10})/,type:'pet',tag:'宠物',fmt:m=>m[0].match(/猫|狗|宠物/)[0]+'叫'+m[1]},
];
const TEACH_RE=/^(?:请)?(?:记(?:住|一下)|记着|learn)[：:，,]?([\s\S]{1,80})$/;
function learnFromText(t){
 const learned=[];
 const teach=t.match(TEACH_RE);
 if(teach){const c=teach[1].trim();if(addMemory('knowledge',c))learned.push({tag:'知识',content:c})}
 for(const r of LEARN_RULES){const m=t.match(r.re);if(m){if(r.type==='name'&&teach)continue;const content=r.fmt(m);if(addMemory(r.type,content))learned.push({tag:r.tag,content})}}
 return learned;
}
function addMemory(type,content){
 if(!content)return false;
 if(memories.find(m=>m.type===type&&m.content===content))return false;
 const sameType=memories.findIndex(m=>m.type===type&&type==='name');
 if(sameType>=0){memories[sameType].content=content;memories[sameType].time=Date.now()}
 else memories.push({type,content,time:Date.now()});
 saveMem();updateMem();return true;
}

function recallRelevant(t){
 const hits=memories.filter(m=>{const c=memText(m);if(c.length<2)return false;return t.includes(c.slice(0,Math.min(4,c.length)))||c.includes(t.slice(0,Math.min(4,t.length)))});
 return hits.slice(0,3);
}

async function apiReply(t){
 const P=PERSONA[cfg.persona];
 const memStr=memories.length?memories.map(m=>TAG_MAP[m.type]+':'+memText(m)).join('；'):'（暂无）';
 const emo=detectEmotion(t);
 let extra='';
 if(emo)extra='\n用户当前情绪疑似【'+emo+'】，请先共情接住情绪，再给予温暖支持，不要说教。';
 if(treehole)extra+='\n当前是树洞模式：不评判、不急着给建议，以陪伴和倾听为主。';
 if(nightCare())extra+='\n现在是深夜，请温柔地关心用户的休息。';
 const sys=P.sys.replace('{nick}',nickOf())+('\n你已学会的关于用户的知识：'+memStr+'\n聊天中如果相关，可以自然地使用这些知识。'+extra);
 const msgs=[{role:'system',content:sys},...history.slice(-20).map(h=>({role:h.role==='user'?'user':'assistant',content:h.text}))];
 const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},body:JSON.stringify({model:'deepseek-chat',messages:msgs,temperature:.9,max_tokens:150})});
 if(!r.ok)throw new Error('API '+r.status);const d=await r.json();return d.choices[0].message.content}

async function handle(t){
 t=t.trim();if(!t)return;
 addMsg('user',t);
 const learned=learnFromText(t);
 if(learned.length){
  learned.forEach(l=>addMsg('learn',('📚 学会了【'+l.tag+'】'+l.content)));
  toast('✨ 路遥学会了 '+learned.length+' 条新知识！');
  setEmotion('excited');
  if(TEACH_RE.test(t)){const c=PERSONA[cfg.persona].learn;addMsg('ai',c);speak(c);return}
 }
 setState('thinking');
 let reply;
 try{reply=cfg.apiKey?await apiReply(t):localReply(t)}catch(e){reply=localReply(t)}
 const emo=detectEmotion(t);
 setEmotion(emo==='happy'?'happy':(emo?'sad':'happy'));
 addMsg('ai',reply);speak(reply);
}

function hug(){
 burstHearts();
 const ch=$('character');ch.classList.remove('hug');void ch.offsetWidth;ch.classList.add('hug');
 setEmotion('love');
 const msg=HUGS[cfg.persona];
 addMsg('hug','🤗 '+(nickOf()!=='朋友'?nickOf()+'，':'')+'抱抱已送达！');
 setTimeout(()=>{addMsg('ai',msg);speak(msg)},300);
 toast('💗 抱抱已发送，爱心填满全屏！');
}
function praise(){
 setEmotion('excited');
 const arr=PRAISE[cfg.persona];
 const msg=arr[Math.floor(Math.random()*arr.length)];
 addMsg('hug','💖 夸夸时间');
 setTimeout(()=>{addMsg('ai',msg);speak(msg)},200);
 toast('💖 今日份夸夸已上线！');
}
function toggleTree(){
 treehole=!treehole;
 $('treeBtn').classList.toggle('on',treehole);
 document.body.classList.toggle('treehole',treehole);
 if(treehole){addMsg('ai','🌙 树洞模式已开启。这里没有评判、没有说教，只有倾听和陪伴。想说什么都可以，我会认真听完每一句。');speak('树洞模式已开启，想说什么都可以，我会认真听完的。')}
 else{addMsg('ai','树洞模式已关闭。不过你要记得，无论什么模式，我都在你身边哦。')}
}
const MOOD_RESP={
'开心':'太好了！看到你开心，我这一整天都有意义啦～快说说遇到什么好事了？',
'还行':'平稳的一天也很好呀，不惊不喜的日子，最适合养精蓄锐。晚上早点休息哦。',
'一般':'嗯，平淡的日子偶尔会让人有点提不起劲…要不要和我聊点轻松的？或者我夸夸你？',
'难过':'抱抱你…谢谢你愿意告诉我。难过的时候不用逼自己开心，想哭就哭一会儿，我陪着你。',
'烦躁':'深呼吸～吸气4秒、屏住4秒、呼气6秒…烦躁就像手里的沙子，越用力越累，先让自己松一松。',
'委屈':'呜呜，受委屈了呀…来，跟我说说，你的委屈我都接住。你没有做错什么，你的感受很重要。'};
function renderMoodHist(){
 const box=$('moodHist');
 if(!moodLog.length){box.innerHTML='还没有打卡记录，今天来第一次吧～';return}
 box.innerHTML='<b>最近记录：</b><br>'+moodLog.slice(-7).reverse().map(r=>'• '+r.date+' '+r.e+' '+r.m).join('<br>');
}
$('moodBtn').onclick=()=>{renderMoodHist();$('moodModal').classList.add('show')};
$('moodClose').onclick=()=>$('moodModal').classList.remove('show');
$('moodModal').onclick=e=>{if(e.target===$('moodModal'))$('moodModal').classList.remove('show')};
document.querySelectorAll('.mood-btn').forEach(b=>b.onclick=()=>{
 const m=b.dataset.m;
 const icons={'开心':'😄','还行':'🙂','一般':'😐','难过':'😢','烦躁':'😡','委屈':'🥺'};
 const today=new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'});
 moodLog=moodLog.filter(r=>r.date!==today);moodLog.push({date:today,m:m,e:icons[m]});
 localStorage.setItem('luyao_moods',JSON.stringify(moodLog));
 renderMoodHist();
 $('moodModal').classList.remove('show');
 burstHearts();
 setEmotion(m==='开心'||m==='还行'?'happy':'sad');
 const reply=MOOD_RESP[m];
 addMsg('user','（心情打卡：'+icons[m]+' '+m+'）');
 setTimeout(()=>{addMsg('ai',reply);speak(reply)},300);
 toast('📔 今日心情已记录！');
});

$('sendBtn').onclick=()=>{handle($('textIn').value);$('textIn').value=''};
$('textIn').addEventListener('keydown',e=>{if(e.key==='Enter'){handle($('textIn').value);$('textIn').value=''}});
$('ttsBtn').onclick=()=>{cfg.tts=!cfg.tts;$('ttsBtn').textContent=cfg.tts?'🔊 语音':'🔇 语音';$('ttsBtn').classList.toggle('off',!cfg.tts);localStorage.setItem('luyao_cfg',JSON.stringify(cfg));if(!cfg.tts)speechSynthesis.cancel()};
$('hugBtn').onclick=hug;
$('praiseBtn').onclick=praise;
$('treeBtn').onclick=toggleTree;
$('clearBtn').onclick=()=>{history=[];localStorage.removeItem('luyao_hist');$('chatBox').innerHTML=''};
$('memBtn').onclick=()=>{renderMemList();$('memModal').classList.add('show')};
$('memClose').onclick=()=>$('memModal').classList.remove('show');
$('memClear').onclick=()=>{if(confirm('确定清空路遥学会的全部知识吗？')){memories=[];saveMem();updateMem();renderMemList()}};
$('memModal').onclick=e=>{if(e.target===$('memModal'))$('memModal').classList.remove('show')};
$('character').onclick=()=>{const lines=['怎么啦？想我了呀？嘿嘿。','我在呢，一直都在～','戳我干嘛，痒痒的！','要不要试试点"抱抱"？我超会抱的！','今天也要记得对自己好一点哦。'];const l=lines[Math.floor(Math.random()*lines.length)];setEmotion('happy');addMsg('ai',l);speak(l)};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
if(SR){rec=new SR();rec.lang='zh-CN';rec.interimResults=false;
rec.onresult=e=>{handle(e.results[0][0].transcript)};
rec.onend=()=>{$('micBtn').classList.remove('rec');if(state==='listening')setState('idle')};
rec.onerror=()=>{$('micBtn').classList.remove('rec');setState('idle');addMsg('ai','（我好像没听清，你打字告诉我吧～）')};
$('micBtn').onclick=()=>{try{rec.start();$('micBtn').classList.add('rec');setState('listening')}catch(e){rec.stop()}}}else{$('micBtn').title='当前浏览器不支持语音识别，请用Chrome/Edge'}

$('openSet').onclick=()=>{$('cfgNick').value=cfg.nick;$('cfgPersona').value=cfg.persona;$('cfgKey').value=cfg.apiKey;loadVoices();$('modal').classList.add('show')};
$('saveSet').onclick=()=>{cfg.nick=$('cfgNick').value.trim();cfg.persona=$('cfgPersona').value;cfg.apiKey=$('cfgKey').value.trim();cfg.voiceName=$('cfgVoice').value;localStorage.setItem('luyao_cfg',JSON.stringify(cfg));$('modal').classList.remove('show');addMsg('ai','设置保存好啦，我已经准备好了～');};
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};

history.forEach(h=>{const d=document.createElement('div');d.className='msg '+h.role;d.textContent=h.text;$('chatBox').appendChild(d)});$('chatBox').scrollTop=99999;
updateMem();setEmotion('happy');
setTimeout(()=>{
 const follow=troubleFollowUp();
 const g=follow?follow:timeGreet();
 addMsg('ai',g);speak(g);
},600);
</script>
</body>
